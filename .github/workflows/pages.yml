name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepara il sito statico
        run: node scripts/build-site.js

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica l'artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'
          retention-days: 3

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
