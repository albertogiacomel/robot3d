name: Robot 3D CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robot3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verifica
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verifica igiene repository
        run: |
          npm ci
          npm run check:hygiene
          node scripts/site-privacy-check.js

      - name: Controllo sintassi
        run: |
          node --check robot.js
          node --check robot-actions.js
          node --check site.js

      - name: Build del sito statico
        run: node scripts/build-site.js

      - name: Upload del sito
        uses: actions/upload-artifact@v4
        with:
          name: robot3d-site
          path: dist
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy Cloudflare Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-pages
      url: https://robot3d.giacomel.info
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build del sito statico
        run: node scripts/build-site.js

      - name: Verifica del secret Cloudflare
        id: secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret CLOUDFLARE_API_TOKEN assente: deploy Cloudflare saltato (GitHub Pages resta attivo)."
          fi

      - name: Publish su Cloudflare Pages
        if: steps.secret.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '291702df5c8eef8684918f4f92ca4c4d'
        run: npx --yes wrangler@4.151.3 pages deploy dist --project-name robot3d --branch main --commit-hash "$GITHUB_SHA"

      - name: Verifica del sito pubblicato
        if: steps.secret.outputs.available == 'true'
        env:
          SITE_URL: https://robot3d.giacomel.info
          PAGES_URL: https://robot3d.pages.dev
        run: |
          set -euo pipefail

          # 1) Deployment effettivo (host pages.dev, non protetto dal WAF)
          ok=0
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PAGES_URL" || true)
            if [ "$code" = "200" ]; then
              echo "Deployment online: $PAGES_URL"
              ok=1
              break
            fi
            echo "attesa deployment ($code)…"
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "Deployment non raggiungibile: $PAGES_URL" >&2
            exit 1
          fi

          # 2) Dominio custom: Cloudflare puo' rispondere 403 alle IP dei runner
          #    (bot management) pur con il sito sano: non e' un errore di deploy.
          domain_code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL" || true)
          echo "Dominio $SITE_URL -> HTTP $domain_code"
          case "$domain_code" in
            2*|3*) echo "Sito online sul dominio custom" ;;
            403) echo "::notice::HTTP 403 dal dominio custom (risposta edge Cloudflare alle IP datacenter): verifica manuale necessaria." ;;
            *) echo "::warning::Codice inatteso dal dominio custom: $domain_code" ;;
          esac
