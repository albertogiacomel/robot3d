name: Robot 3D CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robot3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verifica
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Controllo sintassi
        run: |
          node --check robot.js
          node --check robot-actions.js
          node --check site.js

      - name: Build del sito statico
        run: node scripts/build-site.mjs

      - name: Upload del sito
        uses: actions/upload-artifact@v4
        with:
          name: robot3d-site
          path: dist
          if-no-files-found: error

  deploy:
    name: Deploy Cloudflare Pages
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://robot3d.giacomel.info
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build del sito statico
        run: node scripts/build-site.mjs

      - name: Verifica del secret Cloudflare
        id: secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret CLOUDFLARE_API_TOKEN assente: deploy Cloudflare saltato (GitHub Pages resta attivo)."
          fi

      - name: Publish su Cloudflare Pages
        if: steps.secret.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '291702df5c8eef8684918f4f92ca4c4d'
        run: npx --yes wrangler@4.151.3 pages deploy dist --project-name robot3d --branch main --commit-hash "$GITHUB_SHA"

      - name: Verifica del sito pubblicato
        if: steps.secret.outputs.available == 'true'
        env:
          SITE_URL: https://robot3d.giacomel.info
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL" || true)
            if [ "$code" = "200" ]; then
              echo "Sito online: $SITE_URL"
              exit 0
            fi
            echo "attesa ($code)…"
            sleep 15
          done
          echo "Sito non raggiungibile: $SITE_URL" >&2
          exit 1
